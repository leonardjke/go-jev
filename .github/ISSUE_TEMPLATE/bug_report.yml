name: Bug report
description: Something in the client does not behave as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproducing it
      description: >
        The smallest snippet that shows the problem. Redact your API key.
      render: go
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: go-jev version
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go version go1.25.0 linux/amd64
    validations:
      required: true
